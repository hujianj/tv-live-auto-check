name: Reconcile IPTV primary CDN

on:
  workflow_run:
    workflows:
      - Verify and publish IPTV auto-check playlist
    types:
      - completed
  schedule:
    # CDN propagation is independent of media-source maintenance. A small
    # hourly reconciler closes the gap without repeating the full URL scan.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: iptv-primary-cdn-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current publication
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          ref: main
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Validate publication before touching CDN caches
        id: publication
        run: python scripts/check_publication_endpoints.py --repo "${{ github.repository }}" --branch main --validate-only
      - name: Reconcile authoritative Raw, primary CDN and television backups
        id: reconcile
        continue-on-error: true
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          status=1
          mkdir -p cdn-rounds
          round=0
          for delay in 0 60 120 180; do
            round=$((round + 1))
            if [ "$delay" -gt 0 ]; then
              echo "Waiting ${delay}s before the next CDN purge/check round."
              sleep "$delay"
            fi
            timeout --signal=TERM --kill-after=10s 150s \
              python scripts/check_publication_endpoints.py \
              --repo "${GITHUB_REPOSITORY}" \
              --branch main \
              --require-all-television \
              --global-deadline 120 \
              --retry-wait 5
            status=$?
            for report in cdn-health-report.md cdn-health-report.json; do
              if [ -f "$report" ]; then cp "$report" "cdn-rounds/round-${round}-${report}"; fi
            done
            if [ "$status" -eq 0 ]; then
              cat cdn-health-report.md >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A healthy hourly check does not need a purge. Keep purge bounded
            # and retain every observation instead of overwriting earlier evidence.
            if [ "$round" -lt 4 ]; then
              python scripts/purge_jsdelivr.py \
                --repo "${GITHUB_REPOSITORY}" \
                --branch main \
                --pre-wait 0 > "cdn-rounds/round-${round}-purge.log" 2>&1
              cat "cdn-rounds/round-${round}-purge.log"
            fi
          done
          if [ -f cdn-health-report.md ]; then cat cdn-health-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Upload CDN reconciliation evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cdn-reconcile-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cdn-health-report.md
            cdn-health-report.json
            cdn-rounds/
      - name: Notify CDN pending state
        if: steps.reconcile.outcome == 'failure'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_maintenance.py cdn_pending --scope cdn --message "主订阅或电视备用端点在本运行网络中仍滞后或不可访问。详情与逐轮哈希见 CDN artifact；不能将 HTTP 200、purge finished 或主节点成功当成全部节点一致，也不保证旧版频道仍可播。下一轮继续复验。"
      - name: Report invalid publication without a false CDN alert
        if: ${{ failure() && steps.publication.outcome == 'failure' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat cdn-health-report.md >> "$GITHUB_STEP_SUMMARY"
          python scripts/notify_maintenance.py failure --scope maintenance --message "仓库中现有订阅未通过格式或地址安全校验。本轮没有检测或清除 CDN 缓存，不能归因为 CDN 滞后；需先生成通过完整发布门禁的新订阅。"
      - name: Close recovered CDN issue
        if: steps.reconcile.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_maintenance.py success --scope cdn
      - name: Mark unreconciled CDN as failed
        if: steps.reconcile.outcome == 'failure'
        run: exit 1
