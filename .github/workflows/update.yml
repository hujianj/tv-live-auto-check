name: Verify and publish IPTV auto-check playlist

on:
  workflow_dispatch:
  schedule:
    # 04:20 and 16:20 Beijing time (20:20 and 08:20 UTC).
    - cron: "20 8,20 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/*.py"
      - "config/*.json"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  issues: write

# A full run can take 20-40 minutes. Schedules and manual dispatches queue, but
# a code push invalidates an in-flight result and should cancel it immediately.
concurrency:
  group: iptv-autocheck-update-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Refuse publication from a non-default branch
        if: ${{ github.ref_type != 'branch' || github.ref_name != github.event.repository.default_branch }}
        run: |
          echo "Only the default branch may run the publication pipeline."
          echo "ref_type=${{ github.ref_type }} ref_name=${{ github.ref_name }} default=${{ github.event.repository.default_branch }}"
          exit 1
      - name: Record source revision
        run: echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Skip stale queued run before expensive probes
        id: preflight
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git fetch origin "$TARGET_BRANCH"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Preflight fetch failed; continuing because the commit gate will re-check freshness." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          remote_sha=$(git rev-parse "origin/$TARGET_BRANCH")
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Maintenance preflight"
              echo
              echo "Queued run skipped because main advanced: source=$SOURCE_SHA remote=$remote_sha"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: ${{ steps.preflight.outputs.stale != 'true' }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run complete maintenance pipeline with bounded network retry
        id: maintenance
        if: ${{ steps.preflight.outputs.stale != 'true' }}
        env:
          IPTV_CHECK_WORKERS: "192"
          IPTV_CHECK_WORKERS_PER_HOST: "8"
          IPTV_CHECK_TIMEOUT: "6"
          IPTV_FETCH_WORKERS: "64"
          IPTV_FETCH_TIMEOUT: "20"
          IPTV_HLS_VARIANT_CHECKS: "2"
          IPTV_HLS_SEGMENT_CHECKS: "2"
          IPTV_CORE_HLS_SEGMENT_CHECKS: "3"
          IPTV_CORE_RETRY_ATTEMPTS: "1"
          IPTV_CORE_RETRY_TIMEOUT: "14"
          IPTV_HLS_PROGRESS_MIN_WAIT: "3"
          IPTV_HLS_PROGRESS_MAX_WAIT: "14"
          IPTV_PUBLISHED_RECHECK_WORKERS: "64"
          IPTV_PUBLISHED_REFILL_WORKERS: "24"
          IPTV_PUBLISHED_FINAL_RETRY_WORKERS: "16"
          IPTV_PUBLISHED_FINAL_RETRY_TIMEOUT: "14"
          IPTV_PUBLISHED_FINAL_RETRY_ATTEMPTS: "1"
          IPTV_PUBLISHED_REQUIRE_CORE_PROGRESS: "1"
          IPTV_PUBLISHED_REQUIRE_BROADCAST_PROGRESS: "1"
        run: python scripts/run_maintenance.py
      - name: Upload full diagnostic artifacts
        if: ${{ always() && steps.preflight.outputs.stale != 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-iptv-check-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            live-curated.txt
            live.txt
            live-verified.txt
            ku9-live.txt
            live.m3u
            ku9-family.txt
            live-family.txt
            family.m3u
            stream_check_results.csv
            live-all-playable.txt
            all-playable.m3u
            curated-source-map.csv
            curated-candidate-pool.csv
            alias-conflict-report.md
            published_recheck_results.csv
            sources_status.csv
            source-report.md
            curated-report.md
            published-recheck-report.md
            final-publish-report.md
            stability-report.md
            coverage-report.md
            quality-audit-report.md
            publish-guard-report.md
            publish-size-report.md
            publish-manifest.json
            full-check-summary.json
            maintenance-run.json
            maintenance-attempt-*
      - name: Commit verified playlist without overwriting newer code
        id: commit
        if: ${{ steps.preflight.outputs.stale != 'true' && steps.maintenance.outcome == 'success' }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" != "branch" ]; then
            echo "Ref is not a branch; refusing to publish generated files."
            exit 1
          fi
          if [ "$TARGET_BRANCH" != "$DEFAULT_BRANCH" ]; then
            echo "Only the default branch may publish: target=$TARGET_BRANCH default=$DEFAULT_BRANCH"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t publish_files < <(python scripts/publication_config.py --publication-files)
          git add -- "${publish_files[@]}" publish-manifest.json
          if git diff --cached --quiet; then
            echo "No verified publication changes to commit."
            exit 0
          fi
          git fetch origin "$TARGET_BRANCH"
          remote_sha=$(git rev-parse "origin/$TARGET_BRANCH")
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo "Remote branch advanced during verification: source=$SOURCE_SHA remote=$remote_sha"
            echo "Refusing to publish results generated from stale code/configuration."
            exit 1
          fi
          git commit -m "chore: verify and publish playable IPTV playlist"
          git push origin "HEAD:$TARGET_BRANCH"
      - name: Purge subscription files after Git propagation
        if: ${{ steps.commit.outcome == 'success' }}
        continue-on-error: true
        run: python scripts/purge_jsdelivr.py --repo "${{ github.repository }}" --branch "${{ github.ref_name }}" --pre-wait 30
      - name: Verify Raw and all configured publication endpoints
        id: cdn_health
        if: ${{ steps.commit.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          run_endpoint_check() {
            # Thread cancellation cannot forcibly stop a resolver that is
            # stuck below Python's socket timeout. Keep the job bounded at
            # the process level as a final watchdog around the checker.
            timeout --signal=TERM --kill-after=15s 270s \
              python scripts/check_publication_endpoints.py \
              --repo "${{ github.repository }}" \
              --branch "${{ github.ref_name }}" \
              --global-deadline 240 \
              --retry-wait 3
          }
          run_endpoint_check
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "Canonical endpoint check is not current; delay, purge, and verify once more." | tee -a "$GITHUB_STEP_SUMMARY"
            python scripts/purge_jsdelivr.py \
              --repo "${{ github.repository }}" \
              --branch "${{ github.ref_name }}" \
              --pre-wait 30
            run_endpoint_check
            status=$?
          fi
          if [ -f cdn-health-report.md ]; then cat cdn-health-report.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: Upload CDN health artifact
        if: ${{ always() && steps.commit.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cdn-health-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            cdn-health-report.md
            cdn-health-report.json
      - name: Notify hard maintenance failure
        if: ${{ always() && (steps.maintenance.outcome == 'failure' || steps.commit.outcome == 'failure') }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.maintenance.outcome }}" = "failure" ]; then
            message="The media verification or publication validation pipeline failed."
          else
            message="The verified playlist passed validation, but the stale-source/commit/push gate failed."
          fi
          python scripts/notify_maintenance.py failure --report maintenance-run.json --message "$message"
      - name: Notify CDN pending state
        if: ${{ always() && steps.maintenance.outcome == 'success' && steps.commit.outcome == 'success' && steps.cdn_health.outcome == 'failure' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_maintenance.py cdn_pending --scope cdn --message "Git publication succeeded, but one or more configured public endpoints are still stale or unreachable; Raw remains authoritative."
      - name: Close recovered media or publication issue
        if: ${{ always() && steps.maintenance.outcome == 'success' && steps.commit.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_maintenance.py success --scope maintenance
      - name: Close recovered CDN issue
        if: ${{ always() && steps.maintenance.outcome == 'success' && steps.commit.outcome == 'success' && steps.cdn_health.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/notify_maintenance.py success --scope cdn
